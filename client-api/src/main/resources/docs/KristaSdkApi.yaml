            $ref: '#/components/schemas/NamedValuedField'
        name:
          type: string
        value:
          type: object
    MessageSubmit:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: object
        submitType:
          type: string
          enum:
            - "SUBMIT, PATH, SIDEBAR"
        submitValue:
          type: string
    Topic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
