      properties:
        messageId:
          type: string
        userMessage:
          type: string
        creationTime:
          type: integer
          format: int64
        flowId:
          type: string
        paths:
          type: array
          items:
            type: string
        sideConversations:
          type: array
          items:
            type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/NamedValuedField'
        submitType:
          type: string
