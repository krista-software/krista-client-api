          type: string
        primaryEmailAddress:
          type: string
        inboxId:
          type: string
        person:
          $ref: '#/components/schemas/Person'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        customAttributes:
          type: object
          additionalProperties:
            type: object
    Person:
      type: object
      properties:
        personId:
          type: string
        personName:
          type: string
        avatarUrl:
          type: string
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ConversationExecution:
      type: object
      properties:
        executionId:
          type: string
