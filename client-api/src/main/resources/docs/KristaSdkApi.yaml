          schema:
            type: integer
            format: int32
            default: 0
        - name: pageSize
          in: query
          schema:
            maximum: 50
            type: integer
            format: int32
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic'
        "401":
          description: User not authorized.
          content:
            application/json: {}
components:
  schemas:
    Account:
      type: object
